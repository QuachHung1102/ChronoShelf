<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cửa Sổ Lịch Sử">
  <!--
    Cửa sổ gỗ mở ra một quyển sách — đúng hai hình của sản phẩm.

    Vẽ CHO 16px trước rồi mới để nó phóng to, chứ không ngược lại: ở kích thước tab
    trình duyệt, mọi nét mảnh hơn 2px biến thành một vệt xám. Vì vậy chỉ có ba khối
    đặc và một thanh ngang, không có chi tiết nào nhỏ hơn 3px.

    Màu lấy đúng từ token trong DESIGN.md (primary #6e4a2e, tertiary-deep #a83a10,
    surface #fbf4e4). Đây là một trong hai chỗ được phép viết hex — favicon không đi
    qua Tailwind nên không có class nào để dùng. Đổi palette thì đổi cả ở đây.
  -->
  <rect width="32" height="32" rx="7" fill="#6e4a2e"/>

  <!-- Khung cửa sổ: hai cánh mở, để lộ khoảng sáng ở giữa. -->
  <rect x="6" y="6" width="20" height="20" rx="2" fill="#3b2415"/>
  <rect x="8.5" y="8.5" width="15" height="15" rx="1" fill="#fbf4e4"/>

  <!-- Quyển sách đang mở: hai trang nghiêng vào nhau quanh gáy. -->
  <path d="M16 12.5c-1.6-1.1-3.4-1.5-5.2-1.4v8.6c1.8-.1 3.6.3 5.2 1.4z" fill="#a83a10"/>
  <path d="M16 12.5c1.6-1.1 3.4-1.5 5.2-1.4v8.6c-1.8-.1-3.6.3-5.2 1.4z" fill="#a83a10"/>

  <!-- Gáy sách, cũng là thanh dọc của khung cửa. -->
  <rect x="15.2" y="11" width="1.6" height="10.5" fill="#3b2415"/>
</svg>
